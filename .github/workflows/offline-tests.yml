# Offline-only test gate.
#
# Per Lucidium Constitution Principle IV (Testability):
#   "Every non-trivial behavior MUST be exercisable without a live model
#    call. ... Run the offline test suite in CI on every change; a red
#    suite blocks merge."
#
# This workflow runs the backend pytest suite (with `respx` failing any
# unmocked outbound HTTP) and the frontend vitest suite (with fetch denied
# in tests/setup.ts). If anything reaches the network, the suites fail.

name: offline-tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

# One in-flight run per ref. A force-push or a new PR commit cancels the
# superseded run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Windows is the primary target platform (PyInstaller onedir bundle +
    # electron-builder 7z), so it is not enough to prove the suite is
    # green on Linux only: path handling, asyncio proactor loop and file
    # locking all differ there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend (with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Lint
        run: ruff check .
      # ruff.toml disables E501 with the comment "line length is enforced
      # by formatter" — that is only true if the formatter check actually
      # runs. This is that check.
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest

      # ``tests/smoke`` lives at the repo root, outside this job's
      # ``working-directory: backend`` and outside backend's
      # ``testpaths = ["tests"]`` — so it had never been collected in
      # CI, and silently rotted. Collecting it here, on both OSes,
      # is what catches that rot: an import error or a broken
      # conftest fails this step in under a second.
      #
      # EXECUTING the suite deliberately does NOT happen here. Its
      # first test runs ``start.ps1 -Setup``, which builds a second
      # complete ``backend/.venv`` — the same ~1.5 GB torch/diffusers
      # tree this job just installed into the runner's Python, plus an
      # ``npm install`` this job has no Node for. That took longer than
      # this job's whole budget and died partway every run. The real
      # execution lives in the ``smoke`` job below, which is
      # provisioned for it and does not pre-install the backend.
      - name: Smoke tests collect (repo root)
        working-directory: .
        run: pytest tests/smoke --collect-only -q -p no:cacheprovider

  # Full ``start.ps1`` pipeline, actually executed. Windows only: the
  # suite auto-skips itself everywhere ``start.ps1`` cannot run, so a
  # Linux copy of this job would be five skips and a wasted runner.
  #
  # This job installs ONLY what the test harness itself imports
  # (pytest, plus ``websockets`` for the handshake round trip). The
  # application dependencies are supposed to be installed BY the code
  # under test — ``start.ps1 -Setup`` creating ``backend/.venv`` is
  # phase 1 of the pipeline, not setup for it. Pre-installing them
  # would both hide setup failures and double the disk/wall-clock.
  smoke:
    runs-on: windows-latest
    # Cold ``start.ps1 -Setup`` alone is ~8 min (venv + the torch /
    # diffusers / onnx tree + npm install); the four phases after it
    # add a few more. 20 min is not enough headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # ``start.ps1`` requires node + npm on PATH (``Test-Required``)
      # and runs ``npm install`` in ``frontend/``. Pin the same major
      # the frontend job uses: ``package.json`` declares
      # ``engines.node: ^22.22.2 || ^24.15.0 || >=26.0.0``, which the
      # runner image's default Node does not necessarily satisfy.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The harness only — see the job comment above. ``websockets`` is
      # imported by ``_hello_round_trip`` in the pytest process itself,
      # not in the spawned backend.
      - name: Install smoke harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9,<10" "websockets>=15,<18"
      - name: Smoke tests (full start.ps1 pipeline)
        run: pytest tests/smoke -v -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Bare ``npm ci`` — no ``|| npm install`` fallback. Failing on a
      # package.json/package-lock.json mismatch is the entire point of
      # ``npm ci``; the fallback silently resolved drift instead.
      - name: Install
        run: npm ci
      # ``src/shared/generated`` is gitignored and produced from
      # ``shared-schemas/*.schema.json``. tsc needs it to exist.
      - name: Codegen (shared schema types)
        run: npm run codegen
      # ``tsc`` previously ran only inside ``npm run build``, which CI
      # never invokes, and vitest strips types without checking them —
      # so no type error could ever fail CI.
      - name: Type check
        run: npx tsc -b --noEmit
      # ``--max-warnings 0``: eslint.config.mjs deliberately reports a
      # triage backlog (react-hooks/*, no-unused-vars, no-explicit-any)
      # at "warn", and without this flag eslint exits 0 no matter how
      # many it finds.
      - name: Lint
        run: npx eslint . --max-warnings 0
      - name: Test
        run: npm test
