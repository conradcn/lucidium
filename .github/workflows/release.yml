# Tagged-release build.
#
# Produces the two shippable artefacts from the tagged source and
# publishes a SHA-256 next to each, so a user downloading a ~2 GB
# self-extractor or AppImage can verify it against a value that came
# out of a public build log rather than trusting the upload.
#
#   windows -> frontend/release/Lucidium-Setup.exe   (7z self-extractor)
#   linux   -> frontend/release/Lucidium-*.AppImage
#
# Both jobs run the same scripts a contributor runs locally
# (``package.ps1`` / ``scripts/package-linux.sh``) rather than a
# CI-only reimplementation, so a green tag build means those scripts
# still work.
#
# NOTE ON RUNNER CAPACITY: these bundles freeze diffusers /
# transformers / accelerate plus a pre-unpacked CPU torch overlay, and
# warm the rembg U2NET (~176 MB) and insightface buffalo_l (~280 MB)
# caches. That is close to a hosted runner's free disk, hence the
# reclaim step in each job. If a tag build fails on ENOSPC, the fix is
# a larger runner, not a smaller bundle.

name: release

on:
  push:
    tags: ["v*"]

# Read by default; only the publish job is granted contents: write.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up backend venv
        shell: pwsh
        run: ./start.ps1 -Setup

      - name: Build Windows package
        shell: pwsh
        run: ./package.ps1 -WindowsOnly

      - name: Checksum
        shell: pwsh
        run: |
          $exe = "frontend/release/Lucidium-Setup.exe"
          if (-not (Test-Path $exe)) { throw "package.ps1 finished but $exe is missing." }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          # Two-space separator + bare filename = `sha256sum -c` format.
          "$hash  $(Split-Path $exe -Leaf)" |
            Set-Content -Path "$exe.sha256" -Encoding ascii -NoNewline
          Write-Host "$hash  Lucidium-Setup.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucidium-windows-${{ github.ref_name }}
          path: |
            frontend/release/Lucidium-Setup.exe
            frontend/release/Lucidium-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # AppImage assembly needs FUSE for the runtime, and the hosted
      # image ships a lot we do not need.
      - name: Reclaim disk / install FUSE
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Build Linux package
        run: bash scripts/package-linux.sh

      - name: Checksum
        run: |
          set -euo pipefail
          appimage=$(ls -t frontend/release/Lucidium-*.AppImage | head -n1)
          [ -n "$appimage" ] || { echo "no AppImage produced" >&2; exit 1; }
          ( cd "$(dirname "$appimage")" \
            && sha256sum "$(basename "$appimage")" > "$(basename "$appimage").sha256" \
            && cat "$(basename "$appimage").sha256" )

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: lucidium-linux-${{ github.ref_name }}
          path: |
            frontend/release/Lucidium-*.AppImage
            frontend/release/Lucidium-*.AppImage.sha256
          if-no-files-found: error
          retention-days: 30

  # Both build jobs upload to the Actions tab, which is not a place a user
  # can be sent. This job collects those artefacts onto an actual Releases
  # page with their checksums.
  #
  # The release is created as a DRAFT on purpose: a tag push should not
  # publish a ~2 GB download to the world with no human in the loop. Review
  # the notes and the two artefacts, then hit Publish. To make tags publish
  # unattended, set ``draft: false`` below.
  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A tag that produced only one of the two platforms is a failed
      # release, not a partial one — catch it here rather than after
      # someone has downloaded the half that exists.
      - name: Verify both platforms present
        run: |
          set -euo pipefail
          ls -lhR artifacts
          test -f artifacts/Lucidium-Setup.exe             || { echo "Windows installer missing" >&2; exit 1; }
          ls artifacts/Lucidium-*.AppImage >/dev/null 2>&1             || { echo "Linux AppImage missing" >&2; exit 1; }

      # Re-verify the checksums the build jobs recorded. If an artefact were
      # corrupted in transit through the artifact store, this is where it
      # surfaces — before the bytes are attached to a public release.
      - name: Verify checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          for f in *.sha256; do
            echo "== $f"
            sha256sum -c "$f"
          done

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Lucidium ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/Lucidium-Setup.exe
            artifacts/Lucidium-Setup.exe.sha256
            artifacts/Lucidium-*.AppImage
            artifacts/Lucidium-*.AppImage.sha256
          body: |
            ## Install

            **Windows** — download `Lucidium-Setup.exe` and run it. It is a
            self-extracting archive, not an installer service; it unpacks the
            app where you point it.

            **Linux** — download the `.AppImage`, `chmod +x` it, and run it.

            Both bundles are large: they carry the frozen Python engine and a
            CPU torch overlay so that image generation works offline on first
            launch. On first run the app downloads an image model matched to
            your GPU (7-20 GB depending on which one).

            You will also need an API key for an OpenAI-compatible LLM
            endpoint — Lucidium does not ship an LLM. See the
            [README](https://github.com/conradcn/lucidium#requirements).

            ## Verifying your download

            Each artefact ships a `.sha256` produced by this build:

            ```
            sha256sum -c Lucidium-Setup.exe.sha256
            ```
